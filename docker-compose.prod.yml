services:
  backend:
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: club_manager_frontend
    restart: always

  db:
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: club_manager_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.proxy.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: club_manager_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
